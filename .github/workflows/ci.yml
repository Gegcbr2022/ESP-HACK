name: firmware-and-native-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pyserial
      - run: python tests/portable/run_formats_tests.py --compiler g++
      - run: python tests/portable/run_lab_tests.py --compiler g++
      - run: python tests/portable/run_legacy_tests.py --compiler g++
      - run: python tests/run_chat_tests.py --compiler g++
      - run: python tests/spi_driver_mock/run_spi_tests.py --compiler g++
      - run: python tests/raw_capture_mock/run.py --cxx g++
      - run: python tests/triggered_capture/run_triggered_tests.py --compiler g++
      - run: python tests/lua_sandbox/run.py --compiler gcc
      - run: python tests/app_install_mock/run.py --cxx g++
      - run: python -m unittest discover -s tests/host -v
  esp32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -e SH1106 -j 4
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: esp32-sh1106
          path: |
            .pio/build/SH1106/firmware.bin
            esp-hack_*-sh1106-full.bin
  flipper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ufbt==0.2.6
      - run: ufbt update --branch=1.5.1
      - run: ufbt
        working-directory: flipper_apps/subghz_chat
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: flipper-chat-fap
          path: flipper_apps/subghz_chat/dist/*.fap
